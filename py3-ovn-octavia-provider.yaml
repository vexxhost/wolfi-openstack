package:
  name: py3-ovn-octavia-provider
  description: OpenStack Octavia integration with OVN
  version: 7.0.0
  epoch: 0
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: ovn-octavia-provider
  import: ovn_octavia_provider

data:
  - name: py-versions
    items:
      3.10: '310'

environment:
  contents:
    packages:
      - py3-supported-build-base
      - py3-supported-pbr

pipeline:
  - uses: git-checkout
    with:
      repository: https://opendev.org/openstack/ovn-octavia-provider
      tag: ${{package.version}}
      expected-commit: 9f8a1e9a142465b887a32facd905306427f36cc5
  - uses: py/validate-pbr-version

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-keystoneauth1=~5.8.0
        - py${{range.key}}-netaddr=~0.10.1
        - py${{range.key}}-neutron-lib=~3.15.0
        - py${{range.key}}-octavia-lib=~3.6.0
        - py${{range.key}}-openstacksdk=~4.0.1
        - py${{range.key}}-oslo-config=~9.6.0
        - py${{range.key}}-oslo-log=~6.1.2
        - py${{range.key}}-oslo-messaging=~14.9.1
        - py${{range.key}}-oslo-serialization=~5.5.0
        - py${{range.key}}-oslo-utils=~7.3.0
        - py${{range.key}}-ovs=~3.4.0
        - py${{range.key}}-ovsdbapp=~2.8.0
        - py${{range.key}}-pbr=~6.1.0
        - py${{range.key}}-sqlalchemy=~2.0.32
        - py${{range.key}}-tenacity=~8.3.0
    pipeline:
      - uses: py/build-wheel
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
